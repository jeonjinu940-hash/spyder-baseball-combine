# main 브랜치에 push될 때마다 Render 재배포를 요청한다.
# 저장소 Secret `RENDER_DEPLOY_HOOK_URL`(Render 대시보드 → Settings → Deploy Hook)이 필요하다.
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set — skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render deploy triggered."
