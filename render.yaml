services:
  - type: web
    name: spyder-baseball-combine
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA 라우팅: /records, /players/:id 등 하위 경로 새로고침 시 index.html 제공
      - type: rewrite
        source: /*
        destination: /index.html
